version: 2

sources:
  - name: google_search_console
    database: analytics-engineering-jobs
    schema: searchconsole
    loader: Google Search Console bulk export
    description: |
      Google Search Console bulk export for the `sc-domain:analyticsengineeringjobs.com` domain property. The property covers every host on the domain, so job URLs are in scope by construction. Google publishes each date two to three days after it closes and occasionally republishes a date, which `ExportLog.epoch_version` records.
    tables:
      - name: searchdata_url_impression
      - name: searchdata_site_impression
      - name: ExportLog
        description: |
          One row per exported date and namespace, carrying the time Google published the export. This is the only real delivery timestamp in the export, so freshness is measured here rather than against `data_date`, which is when searches happened rather than when they landed. Thresholds follow the observed cadence: publishes land about daily, and the longest observed gap is 80 hours.
        config:
          loaded_at_field: publish_time
          freshness:
            warn_after: {count: 48, period: hour}
            error_after: {count: 96, period: hour}

models:
  - name: stg_google_search_console__url_impressions
    description: |
      Search Console URL-level performance aggregated to one row per date, page path, query, country, search type, device, and search appearance. Query strings, fragments, scheme, and host are stripped so tracking parameters and the `www` host collapse onto the canonical site path, and a trailing slash is enforced to match the site's own URLs. Google emits several rows per key, because anonymized-query volume arrives split into separate buckets, so metrics are summed rather than passed through one for one.
    columns:
      - name: url_impression_id
        description: Stable surrogate key generated from the export's own grain.
        tests:
          - not_null
          - unique
      - name: date_day
        description: UTC date the searches occurred on.
        tests:
          - not_null
      - name: page_id
        description: Stable surrogate key generated from the normalized page path, so any model that normalizes a path with `normalize_page_path` produces the same key for the same page.
        tests:
          - not_null
      - name: page_path
        description: Site path the impressions were served for, normalized with the shared `normalize_page_path` macro.
        tests:
          - not_null
      - name: organization_slug
        description: Slug of the organization the path addresses, set on organization pages and on job pages under the current `/jobs/{organization}/{job}/` scheme. Parsed with the same macro as `stg_organizations`, so the two join on one definition.
      - name: job_slug
        description: Slug of the job the path addresses, set only under the current `/jobs/{organization}/{job}/` scheme. Legacy flat job paths stay null rather than being guessed at.
      - name: query
        description: Search query, null when Google withheld it because it was rare. Anonymized rows carry most impressions, so grouping by query silently drops most volume.
      - name: country_code
        description: Country the search came from, as an uppercase ISO 3166-1 alpha-3 code, or `ZZZ` when Google could not determine it.
        tests:
          - not_null
      - name: search_type
        description: Search surface the impression was served on, lowercased.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - image
                  - news
                  - web
      - name: device
        description: Device class the search came from, lowercased.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - desktop
                  - mobile
                  - tablet
      - name: search_appearance
        description: Google Jobs experience the impression was served in, null for a standard result. Google only sets these when the page qualified, so they double as evidence that `JobPosting` markup is being parsed. The export carries them as separate flags; they are mutually exclusive, which a data test on the source enforces.
        tests:
          - accepted_values:
              arguments:
                values:
                  - job_details
                  - job_listing
      - name: n_impressions
        description: Number of times the page appeared in results.
        tests:
          - not_null
      - name: n_clicks
        description: Number of clicks through to the page.
        tests:
          - not_null
      - name: sum_position
        description: Sum of zero-based result positions across the impressions. Kept additive so average position is derived from summed numerator and denominator; a readable average is `sum_position / n_impressions + 1`.
        tests:
          - not_null

  - name: stg_google_search_console__site_impressions
    description: |
      Search Console property-level performance aggregated to one row per date, query, country, search type, and device. Property-level impressions count one appearance per search even when several of the site's pages rank for it, so these totals are not the URL-level totals rolled up and the two are never unioned.
    columns:
      - name: site_impression_id
        description: Stable surrogate key generated from the export's own grain.
        tests:
          - not_null
          - unique
      - name: date_day
        description: UTC date the searches occurred on.
        tests:
          - not_null
      - name: query
        description: Search query, null when Google withheld it because it was rare. Anonymized rows carry most impressions, so grouping by query silently drops most volume.
      - name: country_code
        description: Country the search came from, as an uppercase ISO 3166-1 alpha-3 code, or `ZZZ` when Google could not determine it.
        tests:
          - not_null
      - name: search_type
        description: Search surface the impression was served on, lowercased.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - image
                  - news
                  - web
      - name: device
        description: Device class the search came from, lowercased.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - desktop
                  - mobile
                  - tablet
      - name: n_impressions
        description: Number of times the property appeared in results.
        tests:
          - not_null
      - name: n_clicks
        description: Number of clicks through to the property.
        tests:
          - not_null
      - name: sum_top_position
        description: Sum of the zero-based position of the property's best-ranking result across the impressions. Kept additive; a readable average is `sum_top_position / n_impressions + 1`.
        tests:
          - not_null
