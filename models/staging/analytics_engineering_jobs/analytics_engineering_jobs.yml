version: 2

sources: 
  - name: analytics_engineering_jobs
    schema: dlt_content
    loader: dlt
    config:
      loaded_at_field: timestamp_millis(cast(cast(_dlt_load_id as float64) * 1000 as int64))
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}

    tables:
      - name: jobs
      - name: organizations

models:
  - name: stg_jobs
    description: Source job frontmatter with stored USD pay fields, annualized whole-dollar bounds, eligibility, and tag groupings. Upstream extraction validates observations; data tests check those guarantees. No pay is inferred or re-extracted here.
    columns:
      - name: salary_min
        description: Stored USD base-pay minimum in its original period.
      - name: salary_max
        description: Stored USD base-pay maximum in its original period.
      - name: salary_unit
        description: Explicit source pay period, preserved separately from inference.
        tests:
          - accepted_values:
              arguments:
                values: [HOUR, DAY, WEEK, MONTH, YEAR]
      - name: salary_unit_inferred
        description: Stored YEAR assumption; only eligible as a fallback when salary_unit is null.
        tests:
          - accepted_values:
              arguments:
                values: [YEAR]
      - name: salary_source
        description: Provenance of the stored USD range; salary frontmatter or reviewed legacy description recovery.
        tests:
          - accepted_values:
              arguments:
                values: [salary, description]
      - name: is_verified
        description: Source verification status; explicitly false excludes salary observations, while missing legacy status does not.
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

      - name: is_salary_eligible
        data_type: bool
        description: Whether upstream-validated USD pay has representable annual bounds and the job is not explicitly unverified. Staging data tests check the upstream bounds, provenance, and inferred-period guarantees. Independent of is_active so historical observations remain available; current summaries must also filter is_active to true.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: salary_annual_min
        data_type: int64
        description: Eligible advertised USD base-pay minimum annualized using 2080 hours, 260 days, 52 weeks, 12 months, or one year, rounded to the nearest whole dollar. Null for ineligible observations. Combined location bands retain their lowest minimum.
      - name: salary_annual_max
        data_type: int64
        description: Eligible advertised USD base-pay maximum annualized with the same factors and rounding as salary_annual_min. Null for ineligible observations. Combined location bands retain their highest maximum; no upper salary ceiling is imposed.
      - name: salary_annual_midpoint
        data_type: float64
        description: Arithmetic midpoint of the eligible whole-dollar annualized advertised minimum and maximum, retaining half dollars when the sum is odd; not actual earnings. Median and 25th/75th percentiles of these per-job values define published pay summaries; the middle 50 percent is not a minimum-to-maximum advertised range.
      - name: job_level
        data_type: string
        description: The single distinct canonical level tag, including the source taxonomy's Contract and Internship categories. Missing or conflicting level tags are Unspecified. People Manager is a separate role-type tag and does not override level; no level is inferred from the job title.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Contract, Internship, Junior, Lead, Mid-Level, Senior, Staff, Unspecified]
      - name: remote_group
        data_type: string
        description: Remote when the Remote tag is present, otherwise Other/unspecified. The latter does not establish onsite work. Keep location alongside this grouping to retain geographic restrictions on remote roles.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Remote, Other/unspecified]

unit_tests:
  - name: stg_jobs_preserves_salary_observations
    description: Stored source fields and inference stay separate, and raw salary text alone does not create a normalized observation.
    model: stg_jobs
    given:
      - input: source("analytics_engineering_jobs", "jobs")
        format: sql
        rows: |
          select 'docs/jobs/example/hourly.md' as file_path, json '{"salary":"$50-75 per hour", "salary_min":50, "salary_max":75, "salary_unit":"HOUR", "salary_unit_inferred":"YEAR", "salary_source":"salary", "verified":true}' as frontmatter

          union all

          select 'docs/jobs/example/legacy.md', json '{"salary_min":100000, "salary_max":150000, "salary_unit_inferred":"YEAR", "salary_source":"description"}'

          union all

          select 'docs/jobs/example/raw.md', json '{"salary":"CAD 100000-150000", "verified":false}'
    expect:
      rows:
        - {job_slug: hourly, salary: "$50-75 per hour", salary_min: 50, salary_max: 75, salary_unit: HOUR, salary_unit_inferred: YEAR, salary_source: salary, is_verified: true}
        - {job_slug: legacy, salary: null, salary_min: 100000, salary_max: 150000, salary_unit: null, salary_unit_inferred: YEAR, salary_source: description, is_verified: null}
        - {job_slug: raw, salary: "CAD 100000-150000", salary_min: null, salary_max: null, salary_unit: null, salary_unit_inferred: null, salary_source: null, is_verified: false}

  - name: stg_jobs_defines_salary_eligibility_and_groupings
    description: Annualizes supported periods to whole dollars, preserves explicit precedence and missing-pay and inactive jobs, handles unrepresentable bounds, and groups tags without guessing.
    model: stg_jobs
