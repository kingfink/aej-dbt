version: 2

models:
  - name: dim_jobs
    description: One row per organization and job slug for every job published on Analytics Engineering Jobs.
    config:
      group: site_content
    columns:
      - name: job_id
        data_type: string
        description: Stable surrogate key generated from the organization and job slugs.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: organization_id
        data_type: string
        description: Organization dimension key for the organization that published the job.
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref("dim_organizations")
                field: organization_id
      - name: organization_slug
        data_type: string
        description: Slug identifying the organization that published the job.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: job_slug
        data_type: string
        description: Slug identifying the job within its organization.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: is_active
        data_type: bool
        description: Whether the job is currently active on the site.
        tests:
          - accepted_values:
              arguments:
                values:
                  - true
                  - false
                quote: false
      - name: is_featured
        data_type: bool
        description: Whether the job is featured on the site.
        tests:
          - accepted_values:
              arguments:
                values:
                  - true
                  - false
                quote: false
      - name: date_added
        data_type: date
        description: Date the job was added to the site.
      - name: date_removed
        data_type: date
        description: Date the job was removed from the site, when applicable.
      - name: title
        data_type: string
        description: Published job title.
      - name: posting_url
        data_type: string
        description: URL of the external job posting.
      - name: description
        data_type: string
        description: Published job description.
      - name: location
        data_type: string
        description: Published job location.
      - name: salary
        data_type: string
        description: Published salary information.
      - name: tags
        data_type: array<string>
        description: Tags assigned to the job.

  - name: dim_organizations
    description: One row per organization published on Analytics Engineering Jobs.
    config:
      group: site_content
    columns:
      - name: organization_id
        data_type: string
        description: Stable surrogate key generated from the organization slug.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: organization_slug
        data_type: string
        description: Slug identifying the organization.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: is_active
        data_type: bool
        description: Whether the organization is currently active on the site.
        tests:
          - accepted_values:
              arguments:
                values:
                  - true
                  - false
                quote: false
      - name: is_featured
        data_type: bool
        description: Whether the organization is featured on the site.
        tests:
          - accepted_values:
              arguments:
                values:
                  - true
                  - false
                quote: false
      - name: name
        data_type: string
        description: Published organization name.
      - name: description
        data_type: string
        description: Published organization description.
      - name: description_short
        data_type: string
        description: Short published organization description.
      - name: organization_url
        data_type: string
        description: Published organization website URL.
      - name: headcount
        data_type: string
        description: Published or inferred organization headcount range.
      - name: location
        data_type: string
        description: Published or inferred organization location.

  - name: dim_web_sessions
    description: |
      One row per PostHog session captured on the production site, carrying the session entry attribution and the acquisition channel derived from it. PostHog stamps the entry referrer and UTM properties on every event in a session and they are constant within a session, so the grain is a plain aggregation over the session identifier and no entry event selection rule is needed. PostHog is consent-gated, so sessions here are a floor on real traffic rather than total traffic.
    config:
      group: web_engagement
    columns:
      - name: session_id
        data_type: string
        description: Stable surrogate key generated from the source and the source session identifier.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: source_session_id
        data_type: string
        description: Session identifier supplied by the behavioral analytics provider.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: source
        data_type: string
        description: Behavioral analytics provider that captured the session.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - posthog
      - name: visitor_id
        data_type: string
        description: |
          Anonymous device identifier for the visitor. Person profiles are disabled, so a visitor is not reconciled across devices or browsers and repeat visitors are undercounted.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: session_started_ts
        data_type: timestamp
        description: Timestamp of the earliest captured event in the session, in UTC.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: session_page_path
        data_type: string
        description: Path of the first page of the session, normalized with the shared `normalize_page_path` macro.
      - name: session_referring_domain
        data_type: string
        description: Host the session was referred from, or `$direct` when the visitor arrived with no referrer.
      - name: session_utm_source
        data_type: string
        description: Lowercased campaign source on the session entry URL.
      - name: session_utm_medium
        data_type: string
        description: Lowercased campaign medium on the session entry URL.
      - name: session_utm_campaign
        data_type: string
        description: Campaign name on the session entry URL.
      - name: channel
        data_type: string
        description: |
          Acquisition channel of the session, from the shared `get_channel` macro, a port of PostHog's default channel type, which builds on GA4's default channel groups. PostHog's source, medium, and referring domain definitions are vendored as the `channel_definitions` seed. Paid mediums such as `cpc` and `paid` resolve to a paid channel by source, then medium, then referring domain. A `$direct` arrival with no UTM source or medium is `direct`. Everything else resolves to an organic channel by the same lookups, falling back to `referral` when there is a referring domain and `unknown` when there is not. Lookups match the exact value before its registrable domain, so `www.google.com` resolves through `google.com` while `mail.google.com` and `gemini.google.com` keep their own `email` and `ai` definitions.

          Two local rules extend the port. UTM medium `organic` is `organic_search`, as in GA4, so Google Jobs apply traffic does not read as direct. A referral from the site's own domain is `internal` rather than `referral`: it comes from the 30-minute session window expiring mid-visit, and it accounted for a quarter of sessions over the 90 days to 2026-09-11. The PostHog export carries no click identifiers, so PostHog's gclid, fbclid, and gad_source rules do not apply.

          A fact row with no session context has a null `session_id` and therefore no channel at all, which is distinct from both `direct` and `unknown`.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - affiliate
                  - ai
                  - audio
                  - cross_network
                  - direct
                  - display
                  - email
                  - internal
                  - organic_search
                  - organic_shopping
                  - organic_social
                  - organic_video
                  - paid_search
                  - paid_shopping
                  - paid_social
                  - paid_unknown
                  - paid_video
                  - push
                  - referral
                  - sms
                  - unknown

  - name: fct_form_submissions
    description: One row per legacy Webflow or current Netlify form submission, linked to known subscribers and site-content dimensions when matching records exist.
    config:
      group: web_engagement
    columns:
      - name: form_submission_id
        data_type: string
        description: Stable surrogate key generated from the source and source submission identifier.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: source_form_submission_id
        data_type: string
        description: Submission identifier supplied by the source platform.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: source
        data_type: string
        description: Platform that collected the form submission.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - netlify
                  - webflow
      - name: form_name
        data_type: string
        description: Canonical form name, with deprecated Webflow variants consolidated under newsletter.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - job-apply-capture
                  - newsletter
                  - offer-review
                  - resume-review
      - name: subscriber_id
        data_type: string
        description: Subscriber dimension key when the submitted address has a known email subscription lifecycle.
        tests:
          - relationships:
              arguments:
                to: ref("dim_email_subscribers")
                field: subscriber_id
      - name: job_id
        data_type: string
        description: Job dimension key for a job-apply capture submission with matching job context.
        tests:
          - relationships:
              arguments:
                to: ref("dim_jobs")
                field: job_id
      - name: organization_id
        data_type: string
        description: Organization dimension key when the submission contains matching organization context.
        tests:
          - relationships:
              arguments:
                to: ref("dim_organizations")
                field: organization_id
      - name: email_address
        data_type: string
        description: Lowercased and trimmed submitted email address.
        constraints:
          - type: not_null
        tests:
          - not_null
          - is_normalized_email_address
      - name: session_id
        data_type: string
        description: |
          Web session dimension key when the submission carries a session identifier that matches a captured PostHog session. Null means no session context rather than direct traffic: `posthog_session_id` capture on Netlify forms began in 2026-07 and is complete from 2026-08 onward, and visitors who declined analytics consent never carry one.
        tests:
          - relationships:
              arguments:
                to: ref("dim_web_sessions")
                field: session_id
      - name: posthog_distinct_id
        data_type: string
        description: Anonymous PostHog browser identifier when the visitor explicitly enabled PostHog analytics, retained as a nullable join key to behavioral events.
      - name: posthog_session_id
        data_type: string
        description: PostHog session identifier when the visitor explicitly enabled PostHog analytics, retained as a nullable join key to behavioral events.
      - name: form_submission_details
        data_type: json
        description: Native JSON object containing populated analytics context not represented by a dimension key, currently job title and outbound job URL.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: submitted_ts
        data_type: timestamp
        description: Timestamp when the source received the form submission.
        constraints:
          - type: not_null
        tests:
          - not_null

  - name: fct_web_events
    description: |
      One row per job page view and outbound apply click captured on the production site. `stg_posthog__events` retains every captured event type, so widening this fact is a one-line change. Events resolve to `dim_pages` on the normalized page path. Events are attributed to a job and organization when the event carries that context, either as event properties or as a current-scheme job or organization page path. Page views are only captured for visitors who consented to analytics, so counts are a floor rather than total traffic. History begins 2025-12-22, and apply clicks begin 2026-04-20. Built incrementally, merging on `event_id` the events that occurred in the three days before each run, so session, page, job, and organization keys on older events reflect the dimensions when the event was loaded until the weekly full refresh rebuilds every event.
    config:
      group: web_engagement
      materialized: incremental
      incremental_strategy: merge
      unique_key: event_id
      on_schema_change: append_new_columns
    columns:
      - name: event_id
        data_type: string
        description: Stable surrogate key generated from the source and the source event ID.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: source_event_id
        data_type: string
        description: Event identifier supplied by the behavioral analytics provider.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: source
        data_type: string
        description: Behavioral analytics provider that captured the event.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - posthog
      - name: event_type
        data_type: string
        description: |
          Provider-independent event type. `apply_click` fires on the outbound application link itself and is independent of what follows in the apply email-capture flow.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - apply_click
                  - page_view
      - name: event_ts
        data_type: timestamp
        description: Timestamp when the event occurred, in UTC.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: visitor_id
        data_type: string
        description: |
          Anonymous device identifier for the visitor. Person profiles are disabled, so a visitor is not reconciled across devices or browsers and repeat visitors are undercounted.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: session_id
        data_type: string
        description: Web session dimension key for the session the event belongs to, carrying the session entry attribution and acquisition channel.
        tests:
          - relationships:
              arguments:
                to: ref("dim_web_sessions")
                field: session_id
      - name: source_session_id
        data_type: string
        description: Session identifier supplied by the behavioral analytics provider, retained as the business key for `session_id`.
      - name: page_id
        data_type: string
        description: Page dimension key for the page the event occurred on.
        tests:
          - relationships:
              arguments:
                to: ref("dim_pages")
                field: page_id
      - name: page_path
        data_type: string
        description: Path of the page the event occurred on, normalized with the shared `normalize_page_path` macro.
      - name: job_id
        data_type: string
        description: Job dimension key when the event carries job context.
        tests:
          - relationships:
              arguments:
                to: ref("dim_jobs")
                field: job_id
      - name: organization_id
        data_type: string
        description: Organization dimension key when the event carries organization context.
        tests:
          - relationships:
              arguments:
                to: ref("dim_organizations")
                field: organization_id
      - name: event_details
        data_type: json
        description: |
          Native JSON object containing populated event-specific details such as outbound_url, link_text, and click_method.
        constraints:
          - type: not_null
        tests:
          - not_null

  - name: dim_pages
    description: |
      One row per site page, keyed on the path normalized with the shared `normalize_page_path` macro and classified with `get_page_type`. Pages are the distinct paths of both the Search Console URL export and PostHog events on the production site, so a page appears once Google has served it in results or a consenting visitor has loaded it, and on-site behavior and search demand slice by the same page. Job and organization keys stay on the facts rather than here, so they join straight to `dim_jobs` and `dim_organizations`.
    config:
      group: web_engagement
    columns:
      - name: page_id
        data_type: string
        description: Stable surrogate key generated from the normalized page path.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: page_path
        data_type: string
        description: Site path with scheme, host, query string, and fragment removed and exactly one trailing slash.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: page_type
        data_type: string
        description: Kind of page the path addresses. Legacy flat job paths are `job` pages that resolve to no job.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - home
                  - job
                  - job_index
                  - landing_page
                  - organization
                  - organization_index
                  - other
                  - subscribe
                  - tag

  - name: dim_countries
    description: |
      One row per ISO 3166-1 country plus Kosovo, from the `countries` seed. Sources that emit different code formats resolve to the same row: Search Console uses three-letter codes and PostHog GeoIP uses two-letter codes.
    config:
      group: web_engagement
    columns:
      - name: country_id
        data_type: string
        description: Stable surrogate key generated from the three-letter country code.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: alpha_3_code
        data_type: string
        description: Uppercase ISO 3166-1 alpha-3 code, or `XKK` for Kosovo.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: alpha_2_code
        data_type: string
        description: Uppercase ISO 3166-1 alpha-2 code, or `XK` for Kosovo.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: country_name
        data_type: string
        description: Readable country name, using the common name where ISO's official name is formal.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: continent_name
        data_type: string
        description: Continent the country belongs to.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Africa
                  - Antarctica
                  - Asia
                  - Europe
                  - North America
                  - Oceania
                  - South America

  - name: fct_search_performance_daily
    description: |
      One row per date, page, query, country, search type, device, and Google Jobs search appearance, from the Search Console URL-level bulk export. Ratios must be derived from the summed measures: click-through rate is `n_clicks / n_impressions` and average position is `sum_position / n_impressions + 1`, because the export's positions are zero based. Most impressions sit on rows where Google withheld the query, so any query drilldown describes a minority of volume. Page attributes live in `dim_pages` and country attributes in `dim_countries`, and job and organization pages resolve to `dim_jobs` and `dim_organizations`, so search demand slices by the same dimensions as on-site behavior. History begins 2026-04-19, and Google publishes each date two to three days late.
    config:
      group: web_engagement
    columns:
      - name: url_impression_id
        data_type: string
        description: Stable surrogate key generated from the export's own grain.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: date_day
        data_type: date
        description: UTC date the searches occurred on.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: page_id
        data_type: string
        description: Page dimension key for the page the impressions were served for.
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref("dim_pages")
                field: page_id
      - name: job_id
        data_type: string
        description: Job dimension key when the path is a job detail page for a known job.
        tests:
          - relationships:
              arguments:
                to: ref("dim_jobs")
                field: job_id
      - name: organization_id
        data_type: string
        description: Organization dimension key when the path carries a known organization.
        tests:
          - relationships:
              arguments:
                to: ref("dim_organizations")
                field: organization_id
      - name: country_id
        data_type: string
        description: Country dimension key for where the search came from. Null when Google could not determine the country, which it reports as `ZZZ`.
        tests:
          - relationships:
              arguments:
                to: ref("dim_countries")
                field: country_id
      - name: query
        data_type: string
        description: Search query, null when Google withheld it because it was rare. Anonymized rows carry most impressions, so grouping by query silently drops most volume.
      - name: device
        data_type: string
        description: Device class the search came from.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - desktop
                  - mobile
                  - tablet
      - name: search_type
        data_type: string
        description: Search surface the impression was served on.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - image
                  - news
                  - web
      - name: search_appearance
        data_type: string
        description: Google Jobs experience the impression was served in, null for a standard result. Google only sets these when the page qualified, so they are direct evidence that `JobPosting` markup is being parsed.
        tests:
          - accepted_values:
              arguments:
                values:
                  - job_details
                  - job_listing
      - name: n_impressions
        data_type: int64
        description: Number of times the page appeared in results.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: n_clicks
        data_type: int64
        description: Number of clicks through to the page.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: sum_position
        data_type: int64
        description: Sum of zero-based result positions across the impressions. Additive, so average position is derived as `sum_position / n_impressions + 1`.
        constraints:
          - type: not_null
        tests:
          - not_null

  - name: fct_search_performance_site_daily
    description: |
      One row per date, query, country, search type, and device, from the Search Console property-level bulk export. Property-level impressions count one appearance per search even when several of the site's pages rank for it, so these totals are lower than the URL-level totals rather than equal to them, and the two facts are deliberately not unioned. Average position uses the best-ranking result and is derived as `sum_top_position / n_impressions + 1`.
    config:
      group: web_engagement
    columns:
      - name: site_impression_id
        data_type: string
        description: Stable surrogate key generated from the export's own grain.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: date_day
        data_type: date
        description: UTC date the searches occurred on.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: country_id
        data_type: string
        description: Country dimension key for where the search came from. Null when Google could not determine the country, which it reports as `ZZZ`.
        tests:
          - relationships:
              arguments:
                to: ref("dim_countries")
                field: country_id
      - name: query
        data_type: string
        description: Search query, null when Google withheld it because it was rare. Anonymized rows carry most impressions, so grouping by query silently drops most volume.
      - name: device
        data_type: string
        description: Device class the search came from.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - desktop
                  - mobile
                  - tablet
      - name: search_type
        data_type: string
        description: Search surface the impression was served on.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - image
                  - news
                  - web
      - name: n_impressions
        data_type: int64
        description: Number of times the property appeared in results.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: n_clicks
        data_type: int64
        description: Number of clicks through to the property.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: sum_top_position
        data_type: int64
        description: Sum of the zero-based position of the property's best-ranking result across the impressions. Additive, so average position is derived as `sum_top_position / n_impressions + 1`.
        constraints:
          - type: not_null
        tests:
          - not_null

  - name: dim_email_campaigns
    description: |
      One row per email campaign, where a campaign is the batch of messages sharing a source, subject, and campaign date. Transactional and test sends are campaigns too; `is_test` separates the test sends and the subject separates the weekly newsletter from transactional mail.
    config:
      group: email
    columns:
      - name: email_campaign_id
        data_type: string
        description: Stable surrogate key generated from the source, subject, and campaign date.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: source
        data_type: string
        description: Email provider that sent the campaign.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - resend
                  - sendgrid
      - name: campaign_name
        data_type: string
        description: |
          Campaign name taken from the `utm_campaign` parameter on the campaign's tracked links, such as `weekly_jobs_2026_08_11`. Null for campaigns whose links carry no campaign parameter and for campaigns that were never clicked.
      - name: subject
        data_type: string
        description: Campaign subject line when supplied by the provider. Always null for SendGrid, which did not record subjects.
      - name: campaign_date
        data_type: date
        description: |
          UTC date the campaign was sent. Anchored to the earliest event on the campaign's messages when the provider never delivered a sent event.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: first_sent_ts
        data_type: timestamp
        description: Earliest sent-event timestamp across the campaign's messages. Null when no message in the campaign ever recorded a sent event.
      - name: message_count
        data_type: int64
        description: Number of provider messages in the campaign, which is one per recipient send.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: is_test
        data_type: bool
        description: Whether the campaign is a test send, identified by a bracketed TEST subject prefix.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - true
                  - false
                quote: false

  - name: dim_email_messages
    description: One row per provider email message across SendGrid and Resend.
    config:
      group: email
    columns:
      - name: email_id
        data_type: string
        description: Stable surrogate key generated from the source and source email ID.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: email_campaign_id
        data_type: string
        description: Campaign dimension key for the campaign the message was part of.
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref("dim_email_campaigns")
                field: email_campaign_id
      - name: source
        data_type: string
        description: Email provider that sent the message.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - resend
                  - sendgrid
      - name: source_email_id
        data_type: string
        description: Message identifier supplied by the email provider.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: subject
        data_type: string
        description: Email subject line when supplied by the provider.
      - name: sent_ts
        data_type: timestamp
        description: Earliest known sent-event timestamp for the message.

  - name: dim_email_subscribers
    description: |
      One row per normalized email address with a subscription lifecycle event. The current `is_subscribed` value reflects Resend contact state; SendGrid events contribute historical context but do not establish current subscription status.
    config:
      group: email
    columns:
      - name: subscriber_id
        data_type: string
        description: Stable surrogate key generated from the normalized email address.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: email_address
        data_type: string
        description: Lowercased and trimmed subscriber email address.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
          - is_normalized_email_address
      - name: resend_contact_id
        data_type: string
        description: Resend contact identifier when the subscriber is known to Resend.
      - name: is_subscribed
        data_type: bool
        description: Whether the address is currently a subscribed Resend contact.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: min_subscribed_ts
        data_type: timestamp
        description: Earliest known subscription timestamp.
      - name: max_subscribed_ts
        data_type: timestamp
        description: Most recent known subscription or resubscription timestamp.
      - name: min_unsubscribed_ts
        data_type: timestamp
        description: Earliest timestamp at which an unsubscribed state is known; snapshot-derived values use the backfill timestamp and do not identify the precise unsubscribe time.
      - name: max_unsubscribed_ts
        data_type: timestamp
        description: Most recent timestamp at which an unsubscribed state is known; snapshot-derived values use the backfill timestamp and do not identify the precise unsubscribe time.

  - name: fct_email_events
    description: |
      One row per provider email event and recipient across SendGrid and Resend, including synthetic sent events from the Resend backfill when no matching webhook event exists. Click events additionally carry a normalized link destination, so link-level analysis needs no separate fact.
    config:
      group: email
    columns:
      - name: email_event_id
        data_type: string
        description: Stable identifier for the provider event and recipient.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: subscriber_id
        data_type: string
        description: Subscriber dimension key when the event recipient has a known subscription lifecycle.
        tests:
          - relationships:
              arguments:
                to: ref("dim_email_subscribers")
                field: subscriber_id
      - name: email_id
        data_type: string
        description: Message dimension key for the event.
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref("dim_email_messages")
                field: email_id
      - name: event_type
        data_type: string
        description: Provider-independent event type such as sent, delivered, opened, or clicked.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - bounced
                  - clicked
                  - delivered
                  - delivery_delayed
                  - opened
                  - resubscribed
                  - sent
                  - suppressed
      - name: event_ts
        data_type: timestamp
        description: Timestamp when the event occurred, in UTC.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: link_url
        data_type: string
        description: |
          Clicked destination URL with the query string and fragment removed, so campaign parameters and per-contact unsubscribe tokens collapse to one value per destination. Null for events that are not clicks.
      - name: link_type
        data_type: string
        description: |
          Destination category of the clicked link. `job_page` is a job posting on the site, `site` is any other page on the site, `unsubscribe` is a provider-hosted unsubscribe page, and `external` is any other destination. Null for events that are not clicks.
        tests:
          - accepted_values:
              arguments:
                values:
                  - external
                  - job_page
                  - site
                  - unsubscribe
      - name: job_id
        data_type: string
        description: |
          Job dimension key when the clicked link points at a job posting under the current job URL scheme. Legacy SendGrid-era job links used a flat single-segment path and stay unresolved.
        tests:
          - relationships:
              arguments:
                to: ref("dim_jobs")
                field: job_id
      - name: is_engagement
        data_type: bool
        description: Whether the event is an open or click. Privacy-proxied and bot-like activity remains included.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - true
                  - false
                quote: false
      - name: is_privacy_or_bot_like
        data_type: bool
        description: Whether the event details classify the open or click as privacy-proxied or bot-like.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - true
                  - false
                quote: false
      - name: email_event_details
        data_type: json
        description: |
          Native JSON object containing populated event-specific details such as ip_address, user_agent, is_backfill, is_privacy_or_bot_like, and privacy_or_bot_reason. The clicked link is promoted to the `link_url`, `link_type`, and `job_id` columns.
        constraints:
          - type: not_null
        tests:
          - not_null

  - name: fct_email_subscribers_daily
    description: One row per UTC date and subscriber from the subscriber's first lifecycle event through the current date, indicating whether the subscriber was subscribed at any point during the date. SendGrid state is used through the Resend contact-import date; Resend state is authoritative beginning the following date because the migration imported both subscribed and unsubscribed contact state. Backfilled unsubscribes represent the state known at migration rather than a precise historical unsubscribe date.
    config:
      group: email
    columns:
      - name: email_subscriber_daily_id
        data_type: string
        description: Stable surrogate key generated from the date and subscriber.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: date_day
        data_type: date
        description: UTC date of the daily subscription state.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: subscriber_id
        data_type: string
        description: Subscriber dimension key.
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref("dim_email_subscribers")
                field: subscriber_id
      - name: is_subscribed
        data_type: bool
        description: Whether the subscriber entered the date subscribed or had a Resend subscribe event during the date.
        constraints:
          - type: not_null
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - true
                  - false
                quote: false

  - name: fct_email_subscriber_messages
    description: One row per email message and known subscriber, with repeated opens and clicks retained in event counts. Event recipients without a known subscription lifecycle remain in `fct_email_events` but are outside this subscriber-level fact. All message-level metrics use min_sent_ts as their time basis.
    config:
      group: email
    columns:
      - name: email_subscriber_message_id
        data_type: string
        description: Stable surrogate key generated from the email and subscriber keys.
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: email_id
        data_type: string
        description: Email message dimension key.
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref("dim_email_messages")
                field: email_id
      - name: subscriber_id
        data_type: string
        description: Subscriber dimension key.
        constraints:
          - type: not_null
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref("dim_email_subscribers")
                field: subscriber_id
      - name: min_sent_ts
        data_type: timestamp
        description: Earliest sent-event timestamp for the message and subscriber; the time basis for all message-level metrics.
      - name: min_delivered_ts
        data_type: timestamp
        description: Earliest delivered-event timestamp for the message and subscriber.
      - name: min_opened_ts
        data_type: timestamp
        description: Earliest open-event timestamp, including privacy-proxied and bot-like activity.
      - name: min_clicked_ts
        data_type: timestamp
        description: Earliest click-event timestamp, including privacy-proxied and bot-like activity.
      - name: n_events_opened
        data_type: int64
        description: Number of open events, including repeated, privacy-proxied, and bot-like activity.
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: n_events_clicked
        data_type: int64
        description: Number of click events, including repeated, privacy-proxied, and bot-like activity.
        constraints:
          - type: not_null
        tests:
          - not_null

unit_tests:
  - name: dim_pages_classifies_page_types
    description: Page type comes from the path prefix, legacy flat job paths are still job pages, a path seen only in PostHog is still a page, and paths repeated within or across sources collapse to one page.
    model: dim_pages
    given:
      - input: ref("stg_google_search_console__url_impressions")
        rows:
          - {page_path: "/"}
          - {page_path: "/jobs/"}
          - {page_path: "/jobs/zocdoc/staff-analytics-engineer-2/"}
          - {page_path: "/jobs/zocdoc/staff-analytics-engineer-2/"}
          - {page_path: "/jobs/airbnb-senior-analytics-engineer/"}
          - {page_path: "/organizations/"}
          - {page_path: "/organizations/zocdoc/"}
          - {page_path: "/landing-pages/dbt/"}
          - {page_path: "/tags/"}
          - {page_path: "/subscribe/"}
          - {page_path: "/about/"}
      - input: ref("stg_posthog__events")
        rows:
          - {page_path: "/jobs/zocdoc/staff-analytics-engineer-2/"}
          - {page_path: "/organizations/hex/"}
          - {page_path: null}
    expect:
      rows:
        - {page_path: "/", page_type: home}
        - {page_path: "/jobs/", page_type: job_index}
        - {page_path: "/jobs/zocdoc/staff-analytics-engineer-2/", page_type: job}
        - {page_path: "/jobs/airbnb-senior-analytics-engineer/", page_type: job}
        - {page_path: "/organizations/", page_type: organization_index}
        - {page_path: "/organizations/zocdoc/", page_type: organization}
        - {page_path: "/organizations/hex/", page_type: organization}
        - {page_path: "/landing-pages/dbt/", page_type: landing_page}
        - {page_path: "/tags/", page_type: tag}
        - {page_path: "/subscribe/", page_type: subscribe}
        - {page_path: "/about/", page_type: other}

  - name: dim_web_sessions_derives_channel_precedence
    description: Events in a session collapse to one row. Paid mediums resolve by source and fall back to paid_unknown; a UTM source beats a `$direct` referrer; an exact host definition beats its registrable domain, so Gemini and Gmail do not read as Google search; UTM medium organic is organic search; the site's own domain is internal; a referrer with no definition is referral and no referrer at all is unknown; and an event with no session identifier produces no session row.
    model: dim_web_sessions
    given:
      - input: ref("stg_posthog__events")
        rows:
          - {session_id: "newsletter", event_ts: "2026-09-01 00:00:00+00", session_referring_domain: "$direct", session_utm_source: "newsletter", session_utm_medium: "email", session_utm_campaign: "weekly_jobs"}
          - {session_id: "newsletter", event_ts: "2026-09-01 00:30:00+00", session_referring_domain: "$direct", session_utm_source: "newsletter", session_utm_medium: "email", session_utm_campaign: "weekly_jobs"}
          - {session_id: "reddit_ad", event_ts: "2026-09-01 00:01:00+00", session_referring_domain: "www.reddit.com", session_utm_source: "reddit", session_utm_medium: "paid", session_utm_campaign: "jobs_board"}
          - {session_id: "unknown_cpc", event_ts: "2026-09-01 00:02:00+00", session_referring_domain: "$direct", session_utm_source: "partner", session_utm_medium: "cpc", session_utm_campaign: null}
          - {session_id: "google_jobs", event_ts: "2026-09-01 00:03:00+00", session_referring_domain: "$direct", session_utm_source: "google_jobs_apply", session_utm_medium: "organic", session_utm_campaign: null}
          - {session_id: "chatgpt_link", event_ts: "2026-09-01 00:04:00+00", session_referring_domain: "$direct", session_utm_source: "chatgpt.com", session_utm_medium: null, session_utm_campaign: null}
          - {session_id: "gemini", event_ts: "2026-09-01 00:05:00+00", session_referring_domain: "gemini.google.com", session_utm_source: null, session_utm_medium: null, session_utm_campaign: null}
          - {session_id: "webmail", event_ts: "2026-09-01 00:06:00+00", session_referring_domain: "mail.google.com", session_utm_source: null, session_utm_medium: null, session_utm_campaign: null}
          - {session_id: "search", event_ts: "2026-09-01 00:07:00+00", session_referring_domain: "www.google.com", session_utm_source: null, session_utm_medium: null, session_utm_campaign: null}
          - {session_id: "social", event_ts: "2026-09-01 00:08:00+00", session_referring_domain: "t.co", session_utm_source: null, session_utm_medium: null, session_utm_campaign: null}
          - {session_id: "internal", event_ts: "2026-09-01 00:09:00+00", session_referring_domain: "www.analyticsengineeringjobs.com", session_utm_source: null, session_utm_medium: null, session_utm_campaign: null}
          - {session_id: "direct", event_ts: "2026-09-01 00:10:00+00", session_referring_domain: "$direct", session_utm_source: null, session_utm_medium: null, session_utm_campaign: null}
          - {session_id: "referral", event_ts: "2026-09-01 00:11:00+00", session_referring_domain: "example.com", session_utm_source: null, session_utm_medium: null, session_utm_campaign: null}
          - {session_id: "no_referrer", event_ts: "2026-09-01 00:12:00+00", session_referring_domain: null, session_utm_source: null, session_utm_medium: null, session_utm_campaign: null}
          - {session_id: null, event_ts: "2026-09-01 00:13:00+00", session_referring_domain: "$direct", session_utm_source: null, session_utm_medium: null, session_utm_campaign: null}
      - input: ref("channel_definitions")
        rows:
          - {domain: "chatgpt.com", kind: "source", type_if_paid: null, type_if_organic: "AI"}
          - {domain: "gemini.google.com", kind: "source", type_if_paid: null, type_if_organic: "AI"}
          - {domain: "google.com", kind: "source", type_if_paid: "Paid Search", type_if_organic: "Organic Search"}
          - {domain: "mail.google.com", kind: "source", type_if_paid: null, type_if_organic: "Email"}
          - {domain: "reddit", kind: "source", type_if_paid: "Paid Social", type_if_organic: "Organic Social"}
          - {domain: "reddit.com", kind: "source", type_if_paid: "Paid Social", type_if_organic: "Organic Social"}
          - {domain: "t.co", kind: "source", type_if_paid: "Paid Social", type_if_organic: "Organic Social"}
          - {domain: "email", kind: "medium", type_if_paid: null, type_if_organic: "Email"}
    expect:
      rows:
        - {source_session_id: "newsletter", session_started_ts: "2026-09-01 00:00:00+00", channel: email}
        - {source_session_id: "reddit_ad", session_started_ts: "2026-09-01 00:01:00+00", channel: paid_social}
        - {source_session_id: "unknown_cpc", session_started_ts: "2026-09-01 00:02:00+00", channel: paid_unknown}
        - {source_session_id: "google_jobs", session_started_ts: "2026-09-01 00:03:00+00", channel: organic_search}
        - {source_session_id: "chatgpt_link", session_started_ts: "2026-09-01 00:04:00+00", channel: ai}
        - {source_session_id: "gemini", session_started_ts: "2026-09-01 00:05:00+00", channel: ai}
        - {source_session_id: "webmail", session_started_ts: "2026-09-01 00:06:00+00", channel: email}
        - {source_session_id: "search", session_started_ts: "2026-09-01 00:07:00+00", channel: organic_search}
        - {source_session_id: "social", session_started_ts: "2026-09-01 00:08:00+00", channel: organic_social}
        - {source_session_id: "internal", session_started_ts: "2026-09-01 00:09:00+00", channel: internal}
        - {source_session_id: "direct", session_started_ts: "2026-09-01 00:10:00+00", channel: direct}
        - {source_session_id: "referral", session_started_ts: "2026-09-01 00:11:00+00", channel: referral}
        - {source_session_id: "no_referrer", session_started_ts: "2026-09-01 00:12:00+00", channel: unknown}