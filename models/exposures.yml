version: 2

exposures:
  - name: steep_dim_email_campaigns
    label: "Steep module: Email Campaigns"
    type: analysis
    maturity: low
    description: One row per email campaign, where a campaign is the batch of messages sharing a provider, subject, and send date. A campaign is the entity that corresponds to a newsletter issue, and transactional and test sends are campaigns too.
    depends_on:
      - ref("dim_email_campaigns")
      - ref("dim_email_messages")
    owner:
      name: Tim Finkel

  - name: steep_dim_email_messages
    label: "Steep module: Email Messages"
    type: analysis
    maturity: low
    description: One row per provider email message across Resend and SendGrid.
    depends_on:
      - ref("dim_email_messages")
      - ref("fct_email_events")
      - ref("fct_email_subscriber_messages")
    owner:
      name: Tim Finkel

  - name: steep_dim_email_subscribers
    label: "Steep module: Email Subscribers"
    type: analysis
    maturity: low
    description: One row per known subscriber, with current subscription state and lifecycle timestamps. Email addresses are intentionally excluded from Steep.
    depends_on:
      - ref("dim_email_subscribers")
      - ref("fct_email_events")
      - ref("fct_email_subscriber_messages")
      - ref("fct_email_subscribers_daily")
      - ref("fct_form_submissions")
    owner:
      name: Tim Finkel

  - name: steep_fct_email_events
    label: "Steep module: Email Activity"
    type: analysis
    maturity: low
    description: One row per provider email event and recipient across Resend and SendGrid, including newsletter link clicks resolved to the job each link points at.
    depends_on:
      - ref("dim_email_campaigns")
      - ref("dim_email_messages")
      - ref("dim_email_subscribers")
      - ref("dim_jobs")
      - ref("fct_email_events")
    owner:
      name: Tim Finkel

  - name: steep_fct_email_subscriber_messages
    label: "Steep module: Email Subscriber Messages"
    type: analysis
    maturity: low
    description: One row per email message and known subscriber, with delivery and engagement outcomes aggregated from provider events.
    depends_on:
      - ref("dim_email_messages")
      - ref("fct_email_subscriber_messages")
    owner:
      name: Tim Finkel

  - name: steep_fct_email_subscribers_daily
    label: "Steep module: Daily Email Subscribers"
    type: analysis
    maturity: low
    description: One row per UTC date and known subscriber, indicating whether the subscriber was subscribed at any point during the date.
    depends_on:
      - ref("fct_email_subscribers_daily")
    owner:
      name: Tim Finkel

  - name: steep_dim_jobs
    label: "Steep module: Jobs"
    type: analysis
    maturity: low
    description: One row per organization and job slug for every job published on Analytics Engineering Jobs.
    depends_on:
      - ref("dim_jobs")
      - ref("fct_email_events")
      - ref("fct_form_submissions")
      - ref("fct_search_performance_daily")
      - ref("fct_web_events")
    owner:
      name: Tim Finkel

  - name: steep_dim_organizations
    label: "Steep module: Organizations"
    type: analysis
    maturity: low
    description: One row per organization published on Analytics Engineering Jobs.
    depends_on:
      - ref("dim_organizations")
      - ref("fct_form_submissions")
      - ref("fct_search_performance_daily")
      - ref("fct_web_events")
    owner:
      name: Tim Finkel

  - name: steep_dim_web_sessions
    label: "Steep module: Web Sessions"
    type: analysis
    maturity: low
    description: One row per PostHog session captured on the production site, carrying the session entry attribution and the acquisition channel derived from it, so page views and form submissions can be split by channel.
    depends_on:
      - ref("dim_web_sessions")
      - ref("fct_form_submissions")
      - ref("fct_web_events")
    owner:
      name: Tim Finkel

  - name: steep_dim_pages
    label: "Steep module: Pages"
    type: analysis
    maturity: low
    description: One row per site page, keyed on the normalized page path and classified by page type, so on-site web events and search performance can be split by the same page.
    depends_on:
      - ref("dim_pages")
      - ref("fct_search_performance_daily")
      - ref("fct_web_events")
    owner:
      name: Tim Finkel

  - name: steep_dim_countries
    label: "Steep module: Countries"
    type: analysis
    maturity: low
    description: One row per ISO 3166-1 country plus Kosovo, so URL-level and property-level search performance can be split by country.
    depends_on:
      - ref("dim_countries")
      - ref("fct_search_performance_daily")
      - ref("fct_search_performance_site_daily")
    owner:
      name: Tim Finkel

  - name: steep_fct_form_submissions
    label: "Steep module: Form Submissions"
    type: analysis
    maturity: low
    description: One row per legacy Webflow or current Netlify form submission, linked to known subscribers, jobs, and organizations when matching records exist.
    depends_on:
      - ref("dim_email_subscribers")
      - ref("dim_jobs")
      - ref("dim_organizations")
      - ref("dim_web_sessions")
      - ref("fct_form_submissions")
    owner:
      name: Tim Finkel

  - name: steep_fct_web_events
    label: "Steep module: Web Events"
    type: analysis
    maturity: low
    description: One row per page view or outbound apply click captured on the production site, carrying job and organization context when the visitor was on a job page. PostHog is consent-gated, so every count is a floor on real traffic rather than total traffic.
    depends_on:
      - ref("dim_jobs")
      - ref("dim_organizations")
      - ref("dim_pages")
      - ref("dim_web_sessions")
      - ref("fct_web_events")
    owner:
      name: Tim Finkel

  - name: steep_fct_search_performance
    label: "Steep module: Search Performance"
    type: analysis
    maturity: low
    description: One row per date, page, query, country, search type, device, and Google Jobs search appearance from the Search Console URL-level export, with impressions, clicks, click-through rate, and average position split by page, country, job, and organization. Kept separate from the property-level module.
    depends_on:
      - ref("dim_countries")
      - ref("dim_jobs")
      - ref("dim_organizations")
      - ref("dim_pages")
      - ref("fct_search_performance_daily")
    owner:
      name: Tim Finkel

  - name: steep_fct_search_performance_site
    label: "Steep module: Site Search Performance"
    type: analysis
    maturity: low
    description: One row per date, query, country, search type, and device from the Search Console property-level export, with best-result average position. Property totals are lower than URL-level totals, so this module is never blended with Search Performance.
    depends_on:
      - ref("dim_countries")
      - ref("fct_search_performance_site_daily")
    owner:
      name: Tim Finkel

  - name: public_jobs_parquet
    label: "Public Parquet: Jobs"
    type: application
    maturity: high
    url: https://storage.googleapis.com/aej-data/jobs.parquet
    description: Public downloadable Parquet interface containing the contracted jobs dimension, including annualized USD salary bounds and a Remote-tag indicator. Current pay summaries require active jobs with both salary bounds, at least 10 salary observations, and an as-of date.
    depends_on:
      - ref("dim_jobs")
    owner:
      name: Tim Finkel

  - name: public_organizations_parquet
    label: "Public Parquet: Organizations"
    type: application
    maturity: high
    url: https://storage.googleapis.com/aej-data/organizations.parquet
    description: Public downloadable Parquet interface containing the contracted organizations dimension.
    depends_on:
      - ref("dim_organizations")
    owner:
      name: Tim Finkel
