name: dbt

"on":
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  parse:
    name: dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dbt
        run: |
          mkdir -p "$RUNNER_TEMP/dbt-bin"
          bash scripts/install-dbt-fusion "$RUNNER_TEMP/dbt-bin"
          echo "$RUNNER_TEMP/dbt-bin" >> "$GITHUB_PATH"
      - name: Resolve dbt packages
        run: bash scripts/dbt-deps
      - name: Verify package lock
        run: git diff --exit-code -- package-lock.yml
      - name: Parse project
        run: bash scripts/dbt-parse

  build:
    name: dbt build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: dbt-ci-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      AEJ_DBT_PR_NUMBER: ${{ github.event.pull_request.number }}
      AEJ_DBT_TARGET: ci
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      # Slim CI: build modified project resources and their descendants, and
      # defer unmodified parents to production. Falls back to a full build
      # until the scheduled production sync has saved a manifest.
      - name: Build modified resources
        run: |
          if uv run modal volume get aej-dbt-prod-state manifest.json - > /dev/null; then
            ./bin/mdbt build --select state:modified+,package:this --defer --state /prod-state
          else
            ./bin/mdbt build --select package:this
          fi
      # Non-blocking production diff audit, scoped to the mart models this run
      # actually built: the build's own selector intersected with the mart
      # path, so a pull request that touches nothing under `models/marts`
      # audits nothing. `--output name` renders a versioned model as
      # `dim_email_campaigns.v2`, which is not a relation, so unique IDs are
      # listed instead and the operation resolves each one through the graph.
      # `mdbt` dispatches through Modal, whose own progress lines share stdout
      # with dbt's, hence the line-wise `fromjson?` filter.
      - name: Audit CI models against production
        continue-on-error: true
        run: |
          if uv run modal volume get aej-dbt-prod-state manifest.json - > /dev/null; then
            ./bin/mdbt ls --select state:modified+,package:this,path:models/marts \
              --resource-type model --output json --output-keys unique_id \
              --defer --state /prod-state > audit-models.log
          else
            ./bin/mdbt ls --select package:this,path:models/marts \
              --resource-type model --output json --output-keys unique_id \
              > audit-models.log
          fi
          unique_ids="$(jq -rR 'fromjson? | objects | .unique_id // empty' audit-models.log)"
          if [ -z "$unique_ids" ]; then
            echo "No mart models in this run's selection; nothing to audit."
            exit 0
          fi
          args="$(printf '%s\n' "$unique_ids" \
            | jq -Rsc 'split("\n") | map(select(. != "")) | {model_unique_ids: .}')"
          ./bin/mdbt run-operation audit_compare_to_prod --args "$args"
